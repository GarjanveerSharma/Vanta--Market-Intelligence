<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A12" />
    <meta name="description" content="Vanta real-time crypto market intelligence and signals." />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      try {
        const preferences = JSON.parse(localStorage.getItem("vanta.viewer-preferences") || "{}");
        const theme = preferences.theme === "light" || preferences.theme === "dark"
          ? preferences.theme
          : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preferences.theme || "system";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <title>Vanta — Market Intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
