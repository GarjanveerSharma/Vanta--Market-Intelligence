<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Vanta real-time crypto market intelligence and signals." />
    <link rel="icon" type="image/svg+xml" href="/vanta-icon-small.svg" />
    <script>
      try {
        const preferences = JSON.parse(localStorage.getItem("vanta.viewer-preferences") || "{}");
        const theme = preferences.theme === "light" || preferences.theme === "dark"
          ? preferences.theme
          : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preferences.theme || "system";
        document.documentElement.classList.toggle("dark", theme === "dark");
      } catch {
        document.documentElement.dataset.theme = "dark";
        document.documentElement.classList.add("dark");
      }
    </script>
    <title>Vanta — Market Intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
